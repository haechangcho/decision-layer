<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
<title id="title">HEARTCOUNT Decision Layer 구성</title>
<desc id="desc">App과 AI Agent가 REST, Python 또는 MCP로 공통 실행 엔진을 호출한다. Decision Layer는 Method와 Recipe를 실행하고 Run(분석 실행 기록)에 근거를 기록한다. Semantic Layer가 지표의 정의와 데이터 조회를 담당하며 DB와 Mart에 연결된다.</desc>
