<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
<title id="title">HEARTCOUNT Decision Layer architecture</title>
<desc id="desc">Apps and AI agents call a shared engine through REST, Python, or MCP. Decision Layer executes Methods and Recipes and records evidence in Runs. The semantic layer owns metric definitions and data queries over databases and marts.</desc>
