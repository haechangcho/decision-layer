name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e '.[dev]'
      - run: pytest            # unit tests, incl. domain-neutral and i18n guards
      - run: pytest examples/method-template/test_method.py

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: package-lock.json}
      - run: npm ci
      - run: npm run docs:build

  onboarding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - name: check Web and API proxy
        run: |
          curl --fail --silent http://localhost:3000/sources > /dev/null
          curl --fail --silent http://localhost:3000/api/health
          curl --fail --silent http://localhost:8000/sources/current
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down

  example:
    # One dataset, independently selected semantic providers, SQL and real MCP.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {provider: cube, compose: compose.override.yaml}
          - {provider: metricflow, compose: compose.dbt.yaml}
    env:
      COMPOSE_FILE: examples/complete-journey/compose.yaml:examples/complete-journey/${{ matrix.compose }}
      DL_JOURNEY_PROVIDER: ${{ matrix.provider }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e '.[dev]'
      - run: docker compose up -d --build --wait --wait-timeout 900 api
      - name: verify source independently
        run: docker compose run --rm --no-deps import python verify.py
      - run: pytest -q -s tests/provider/test_complete_journey_live.py
        env:
          DL_JOURNEY_API_URL: http://127.0.0.1:8000
      - if: failure()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down
