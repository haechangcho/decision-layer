cubes:
- name: transaction
  sql: SELECT row_number() OVER () AS line_id, * FROM journey.transaction_data
  title: Retail transactions
  joins:
  - name: product
    sql: '{CUBE}.product_id = {product}.product_id'
    relationship: many_to_one
  - name: household
    sql: '{CUBE}.household_key = {household}.household_key'
    relationship: many_to_one
  dimensions:
  - name: id
    sql: line_id
    type: number
    primary_key: true
    public: false
  - name: store
    sql: store_id
    type: string
    title: Store
  - name: day_index
    sql: day::integer
    type: number
    title: Source day index
  - name: analysis_date
    sql: transaction_date
    type: time
    title: Transaction date
  - name: household_key
    sql: household_key
    type: string
    title: Source household key
  - name: basket_id
    sql: basket_id
    type: string
    title: Source basket ID
  - name: product_id
    sql: product_id
    type: string
    title: Source product ID
  - name: quantity
    sql: quantity::numeric
    type: number
    title: Source line quantity
  - name: sales_value
    sql: sales_value::numeric
    type: number
    title: Source line retailer receipts
  - name: retail_disc
    sql: retail_disc::numeric
    type: number
    title: Source retail discount
  - name: trans_time
    sql: trans_time
    type: string
    title: Source transaction time code
    description: Original HHMM code, not a timestamp or timezone-aware event time.
  - name: week_no
    sql: week_no::integer
    type: number
    title: Source week number
  - name: coupon_disc
    sql: coupon_disc::numeric
    type: number
    title: Source coupon discount
  - name: coupon_match_disc
    sql: coupon_match_disc::numeric
    type: number
    title: Source coupon match discount
  measures:
  - name: count
    type: count
    title: Transaction lines
  - name: receipts
    sql: sales_value::numeric
    type: sum
    title: Retailer receipts
    description: Amount received by retailer; not profit or necessarily customer cash paid
  - name: units
    sql: quantity::numeric
    type: sum
    title: Units purchased
  - name: baskets
    sql: basket_id
    type: count_distinct
    title: Purchase baskets
  - name: coupon_lines
    type: count
    title: Lines with coupon discount
    filters:
    - sql: '{CUBE}.coupon_disc::numeric < 0'
  - name: coupon_line_rate
    sql: 100.0 * {coupon_lines} / NULLIF({count}, 0)
    type: number
    title: Coupon line rate (%)
