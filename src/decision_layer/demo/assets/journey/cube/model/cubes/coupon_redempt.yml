cubes:
- name: redemption
  sql: SELECT row_number() OVER () AS redemption_id, * FROM journey.coupon_redempt
  title: Coupon redemptions
  joins:
  - name: campaign
    sql: '{CUBE}.campaign = {campaign}.campaign'
    relationship: many_to_one
  - name: household
    sql: '{CUBE}.household_key = {household}.household_key'
    relationship: many_to_one
  dimensions:
  - name: id
    sql: redemption_id
    type: number
    primary_key: true
    public: false
  - name: analysis_date
    sql: redemption_date
    type: time
    title: Redemption date
  - name: household_key
    sql: household_key
    type: string
    title: Source household key
  - name: day_index
    sql: day::integer
    type: number
    title: Source redemption day index
  - name: coupon_upc
    sql: coupon_upc
    type: string
    title: Coupon UPC
  - name: campaign_id
    sql: campaign
    type: string
    title: Campaign ID
  measures:
  - name: count
    type: count
    title: Coupon redemptions
