cubes:
- name: campaign
  sql_table: journey.campaign_desc
  title: Campaigns
  dimensions:
  - name: id
    sql: campaign
    type: string
    primary_key: true
    title: Campaign
  - name: kind
    sql: description
    type: string
    title: Campaign type
  - name: start_day
    sql: start_day::integer
    type: number
    title: Start day index
  - name: end_day
    sql: end_day::integer
    type: number
    title: End day index
  - name: start_date
    sql: start_date
    type: time
    title: Campaign start date
  - name: end_date
    sql: end_date
    type: time
    title: Campaign end date
  measures:
  - name: count
    type: count
    title: Campaigns
