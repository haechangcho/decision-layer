name: decision-layer-online-retail

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: local-example-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail"]
      interval: 5s
      retries: 30

  import:
    build:
      context: .
      dockerfile: Dockerfile.import
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://retail:local-example-only@postgres:5432/retail
    volumes:
      - ./data:/input:ro
      - source_cache:/cache
    restart: "no"

  cube:
    image: cubejs/cube:v1.6.25
    depends_on:
      import: {condition: service_completed_successfully}
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_NAME: retail
      CUBEJS_DB_USER: retail
      CUBEJS_DB_PASS: local-example-only
      CUBEJS_API_SECRET: local-example-secret-change-me-0123456789
      CUBEJS_DEV_MODE: "true"
    volumes:
      - ./cube/model:/cube/conf/model:ro
    ports: ["127.0.0.1:${CUBE_PORT:-4000}:4000"]

  api:
    build: {context: ../.., dockerfile: Dockerfile}
    depends_on: [cube]
    environment:
      CUBE_API_URL: http://cube:4000/cubejs-api/v1
      CUBE_INSTANCE: online-retail
      CUBE_API_SECRET: local-example-secret-change-me-0123456789
      DL_ALLOW_SERVICE_CREDENTIALS: "true"
      DL_RECIPES_DIR: /recipes
      DL_DATABASE_URL: sqlite:////data/decision_layer.db
    volumes:
      - ./recipes:/recipes
      - runs:/data
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]

  web:
    build: {context: ../../web, args: {DL_API_URL: "http://api:8000"}}
    depends_on: [api]
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]

volumes:
  postgres_data:
  source_cache:
  runs:
