cubes:
  - name: ecom_seller
    public: true
    sql_table: ecom.dim_seller
    data_source: default

    title: 판매자
    description: 판매자 마스터. md_team_nm은 현재 소속이다(주문 시점 소속은 ecom_order.md_team_nm).

    joins: []

    dimensions:
      - name: seller_id
        sql: seller_id
        type: string
        primary_key: true
        public: true
        title: 판매자

      - name: seller_nm
        sql: seller_nm
        type: string
        title: 판매자명

      - name: category_l1
        sql: category_l1
        type: string
        title: 주력 대분류

      - name: seller_grade
        sql: seller_grade
        type: string
        title: 판매자 등급

      - name: join_dt
        sql: join_dt
        type: time
        title: 입점일자
