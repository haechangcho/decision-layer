name: music-sales-investigation
version: 1.0.0
description: Compare purchased track sales, then inspect genres and billing countries.
routing:
  use_for: [music sales changed, sales by genre, music store sales]
  do_not_use_for: [profit, causal effect, playlist attribution]
semantic_scope:
  primary_metric: invoice_line.sales
  related_metrics: [invoice_line.units, invoice_line.invoice_count]
  preferred_dimensions: [genre.genre_name, invoice.billing_country]
mode: pipeline
steps:
  - id: trend
    method: query.trend
    purpose: Compare purchase-line sales with the previous equally long period.
    bindings: {metric: $scope.primary_metric, related: $scope.related_metrics}
    params: {vs_previous: true, granularity: month}
  - id: genres
    method: query.drilldown
    purpose: Identify genres contributing to the selected period's sales.
    bindings: {metric: $scope.primary_metric, dimensions: [genre.genre_name]}
  - id: countries
    method: query.drilldown
    purpose: Inspect the same sales by invoice billing country.
    bindings: {metric: $scope.primary_metric, dimensions: [invoice.billing_country]}
limits: {max_steps: 6, max_queries: 30}
validators:
  - name: complete_period
