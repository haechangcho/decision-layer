views:
  - name: music_sales
    title: Music store sales
    description: >
      Purchase-line sales with governed invoice, customer and product joins.
      Generated Chinook sample sales, not a real store performance benchmark.
    cubes:
      - join_path: invoice_line
        includes: [count, sales, units, invoice_count, average_unit_price]
      - join_path: invoice_line.invoice
        includes: [invoice_date, billing_country]
      - join_path: invoice_line.invoice.customer
        includes: [customer_id, country]
      - join_path: invoice_line.invoice.customer.employee
        includes: [rep_name]
      - join_path: invoice_line.track
        includes: [track_name]
      - join_path: invoice_line.track.genre
        includes: [genre_name]
      - join_path: invoice_line.track.media_type
        includes: [format_name]
      - join_path: invoice_line.track.album
        includes: [album_title]
      - join_path: invoice_line.track.album.artist
        includes: [artist_name]
