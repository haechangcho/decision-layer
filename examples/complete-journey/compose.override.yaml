# Docker Compose loads this file automatically: the default example uses Cube.
services:
  cube:
    image: cubejs/cube:v1.6.25
    depends_on:
      import: {condition: service_completed_successfully}
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_NAME: journey
      CUBEJS_DB_USER: journey_reader
      CUBEJS_DB_PASS: local-read-only
      CUBEJS_API_SECRET: local-example-secret-change-me-0123456789
      CUBEJS_DEV_MODE: "true"
    volumes:
      - ../../src/decision_layer/demo/assets/journey/cube/model:/cube/conf/model:ro
      - ../../src/decision_layer/demo/assets/journey/cube/healthcheck.cjs:/cube/conf/healthcheck.cjs:ro
    ports: ["127.0.0.1:${CUBE_PORT:-4000}:4000"]
    healthcheck:
      test: ["CMD", "node", "/cube/conf/healthcheck.cjs"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  api:
    depends_on:
      cube: {condition: service_healthy}
    environment:
      DL_DEPLOYMENT_MODE: demo
      DL_METHOD_ASSETS_DIR: /data/method-assets
      DL_ALLOW_METHOD_EDITING: "true"
      DL_SOURCE_PROVIDER: cube
      CUBE_API_URL: http://cube:4000/cubejs-api/v1
      CUBE_INSTANCE: journey
      CUBE_API_SECRET: local-example-secret-change-me-0123456789
      DL_METHOD_MODULES: examples.recipes.skill_chain
      PYTHONPATH: /opt/decision-layer
    volumes:
      - ../../examples:/opt/decision-layer/examples:ro
