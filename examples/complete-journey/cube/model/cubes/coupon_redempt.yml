cubes:
- name: redemption
  sql: SELECT row_number() OVER () AS redemption_id, * FROM journey.coupon_redempt
  title: Coupon redemptions
  joins:
  - name: campaign
    sql: '{CUBE}.campaign = {campaign}.campaign'
    relationship: many_to_one
  - name: household
    sql: '{CUBE}.household_key = {household}.household_key'
    relationship: many_to_one
  dimensions:
  - name: id
    sql: redemption_id
    type: number
    primary_key: true
    public: false
  - name: analysis_date
    sql: redemption_date
    type: time
    title: Redemption date
  measures:
  - name: count
    type: count
    title: Coupon redemptions
