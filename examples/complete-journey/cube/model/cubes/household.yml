cubes:
- name: household
  sql: SELECT h.household_key, d.classification_1, d.classification_3, d.classification_5 FROM journey.household
    h LEFT JOIN journey.hh_demographic d USING (household_key)
  title: Households
  dimensions:
  - name: id
    sql: household_key
    type: string
    primary_key: true
    title: Household
  - name: age_code
    sql: COALESCE(classification_1, 'Not available')
    type: string
    title: Age classification code
  - name: income_code
    sql: COALESCE(classification_3, 'Not available')
    type: string
    title: Income classification code
  - name: composition_code
    sql: COALESCE(classification_5, 'Not available')
    type: string
    title: Household composition code
  measures:
  - name: count
    type: count
    title: Households
