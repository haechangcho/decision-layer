complete_journey:
  target: reader
  outputs:
    reader:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: journey_reader
      password: local-read-only
      dbname: journey
      schema: journey_dbt
      threads: 1
    setup:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: demo_loader
      password: local-example-only
      dbname: journey
      schema: journey_dbt
      threads: 1
